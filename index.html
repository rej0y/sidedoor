<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="SideDoor">
    <meta name="description"
        content="Browse faculty by department, view office hours, and locate offices on campus">

    <title>Professor Directory</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/style.css">

    <!-- JavaScript -->
    <script src="scripts/main.js" type="module" defer></script>

</head>

<body>

    <main>

        <!-- ==================================================
             LEFT PANEL
        =================================================== -->

        <section id="list-section">

            <h1 class="title">Office Hours Viewer</h1>

            <form id="search-form" onsubmit="return false;">
                <input
                    type="text"
                    id="search-bar"
                    placeholder="Search professors...">

                <button
                    type="button"
                    id="search-button"
                    class="btn btn-primary">
                    Search
                </button>
            </form>

            <h2 class="subtitle">Professor List</h2>

            <p class="text-faded">
                Click on a professor card to see more info
            </p>

            <div id="column-headers">

                <span
                    class="column column-dept"
                    data-sortFor="dept">

                    Department

                    <img
                        class="sort-indicator"
                        src="icons/chevrons-up-down.svg"
                        alt="Sort by department">

                </span>

                <span
                    class="column column-name"
                    data-sortFor="name">

                    Name

                    <img
                        class="sort-indicator"
                        src="icons/chevrons-up-down.svg"
                        alt="Sort by name">

                </span>

                <span
                    class="column column-loc"
                    data-sortFor="loc">

                    Office Location

                    <img
                        class="sort-indicator"
                        src="icons/chevrons-up-down.svg"
                        alt="Sort by location">

                </span>

            </div>

            <div id="prof-list">
                <!-- Professor cards inserted here via JavaScript -->
            </div>

        </section>

        <!-- ==================================================
             RIGHT PANEL (MAP)
        =================================================== -->

        <section id="map-section">

            <div id="map-viewport">

                <!-- Map Header INSIDE map viewport -->

                <div id="map-header">

                    <h2>Campus Map</h2>

                    <p>
                        Click any pin for more info
                    </p>

                    <p>
                        Click &amp; drag to pan • Scroll to zoom
                    </p>

                </div>

                <!-- Map -->

                <div id="map-canvas">

                    <img
                        src="images/campus_map.png"
                        id="campus-map-img"
                        alt="Campus map">

                    <!-- Map pins inserted by JavaScript -->

                </div>

                <!-- Map Controls -->

                <div id="map-controls">

                    <!-- Movement Pad -->

                    <button
                        type="button"
                        id="map-pad"
                        class="btn btn-primary">

                        <span class="arrow up">▲</span>
                        <span class="arrow left">◀</span>
                        <span class="arrow right">▶</span>
                        <span class="arrow down">▼</span>

                    </button>

                    <!-- Zoom In -->

                    <button
                        type="button"
                        class="btn btn-secondary map-zoom-btn"
                        id="btn-zoom-in">

                        +

                    </button>

                    <!-- Zoom Out -->

                    <button
                        type="button"
                        class="btn btn-secondary map-zoom-btn"
                        id="btn-zoom-out">

                        −

                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- ==================================================
         MOBILE TABS
    =================================================== -->

    <div id="section-tabs">

        <button
            class="btn btn-secondary section-tab"
            id="list-section-tab">

            <img
                class="tab-icon"
                src="icons/queue-list.svg"
                alt="List view">

        </button>

        <button
            class="btn btn-secondary section-tab"
            id="map-section-tab">

            <img
                class="tab-icon"
                src="icons/map.svg"
                alt="Map view">

        </button>

        <button
            class="btn btn-secondary section-tab"
            id="split-section-tab">

            <img
                class="tab-icon"
                src="icons/square-split-vertical.svg"
                alt="Split view">

        </button>

    </div>

    <footer>
        <p class="text-faded">
            &copy; SideDoor, Inc. All Rights Reserved.
        </p>
    </footer>

</body>

</html>
